[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="kotoba-unity-api-services"
version="0.1.0"
requires-python=">=3.11"
dependencies=[]
[project.optional-dependencies]
test=["pytest>=8"]

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itonami Registry</title>
<meta name="description" content="Itonami profiles, agents, skills, MCP servers and workflows — with the Hermes registry federated in. Every entry pinned to a commit and a checksum.">
<style>
/* Layout: a catalog list on the left, the selected entry on the right (stacked on phones). */
:root {
  --bg: #f7f7f4; --surface: #ffffff; --ink: #1c1f1d; --muted: #5e6661; --line: #dde1dc;
  --accent: #1f6f5c; --accent-soft: #e3f0ec; --hermes: #6a4cc2; --hermes-soft: #eee9fb;
  --font: "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121513; --surface: #1a1e1b; --ink: #e7ebe8; --muted: #9aa49e; --line: #2c322e;
  --accent: #5cc4a8; --accent-soft: #1f3530; --hermes: #a892f0; --hermes-soft: #2a2440; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
header { padding: 28px 20px 12px; max-width: 1200px; margin: 0 auto; }
h1 { margin: 0; font-size: 26px; letter-spacing: .01em; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.bar { max-width: 1200px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=search] { flex: 1 1 260px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1200px; margin: 0 auto; padding: 8px 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
#list { display: grid; gap: 6px; align-content: start; }
.row { display: grid; gap: 2px; text-align: left; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.row[aria-current=true] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.row b { font-weight: 600; }
.row small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; margin-right: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.tag.hermes { background: var(--hermes-soft); color: var(--hermes); }
#detail { position: sticky; top: 12px; align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
#detail h2 { margin: 0 0 4px; font-size: 20px; }
#detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 14px 0; font-size: 13px; }
#detail dt { color: var(--muted); }
#detail dd { margin: 0; overflow-wrap: anywhere; }
code, pre { font-family: var(--mono); font-size: 12px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
a { color: var(--accent); }
footer { max-width: 1200px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Itonami Registry</h1>
  <p>Itonami profile（= Hermes profile）・agent・skill・MCP・workflow のレジストリ。Hermes registry を同じ形で取り込み、すべての項目を commit と checksum に固定しています。登録は権限を与えず、何も起動しません。</p>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="検索（名前・説明・タグ）" aria-label="検索">
  <div class="chips" id="types" role="group" aria-label="種類"></div>
  <div class="chips" id="registries" role="group" aria-label="レジストリ"></div>
</div>
<main>
  <section id="list" aria-label="項目一覧"><p class="muted">読み込み中…</p></section>
  <aside id="detail" aria-live="polite"><p class="muted">項目を選ぶと、固定された commit・checksum と使い方を表示します。</p></aside>
</main>
<footer id="foot"></footer>
<script>
const TYPES = ['profile', 'agent', 'skill', 'mcp', 'workflow'];
const LABEL = {profile: 'Itonami profile', agent: 'Agent', skill: 'Skill', mcp: 'MCP', workflow: 'Workflow'};
const state = {q: '', type: 'all', registry: 'all', entries: [], current: null};
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function chips(container, values, key, label) {
  container.replaceChildren();
  ['all', ...values].forEach((v) => {
    const b = el('button', 'chip', v === 'all' ? 'すべて' : label(v));
    b.type = 'button'; b.setAttribute('aria-pressed', String(state[key] === v));
    b.addEventListener('click', () => { state[key] = v; render(); });
    container.append(b);
  });
}

function matches(e) {
  if (state.type !== 'all' && e.type !== state.type) return false;
  if (state.registry !== 'all' && e.registry !== state.registry) return false;
  if (!state.q) return true;
  const hay = [e.id, e.name, e.description, (e.tags || []).join(' '), e.category].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}

function render() {
  chips($('#types'), TYPES, 'type', (t) => LABEL[t]);
  chips($('#registries'), [...new Set(state.entries.map((e) => e.registry))], 'registry', (r) => r);
  const rows = state.entries.filter(matches);
  const list = $('#list'); list.replaceChildren();
  list.append(el('p', 'muted', `${rows.length} 件`));
  rows.slice(0, 400).forEach((e) => {
    const b = el('button', 'row'); b.type = 'button';
    b.setAttribute('aria-current', String(state.current === e.qualifiedId));
    const head = el('span');
    head.append(el('span', 'tag' + (e.registry === 'itonami-registry' ? '' : ' hermes'), LABEL[e.type] || e.type), el('b', null, e.name));
    b.append(head, el('small', null, e.description || ''));
    b.addEventListener('click', () => show(e));
    list.append(b);
  });
  if (rows.length > 400) list.append(el('p', 'muted', '400 件まで表示。検索で絞り込んでください。'));
}

async function show(e) {
  state.current = e.qualifiedId; render();
  const d = $('#detail'); d.replaceChildren(el('p', 'muted', '読み込み中…'));
  let data = {};
  try { data = await (await fetch(`api/v1/entries/${e.registry}/${e.type}/${e.id}.json`)).json(); } catch (_) { data = {entry: e}; }
  const entry = data.entry || e;
  d.replaceChildren();
  d.append(el('span', 'tag' + (entry.registry === 'itonami-registry' ? '' : ' hermes'), entry.registry), el('h2', null, entry.name), el('p', null, entry.description || ''));
  const dl = el('dl');
  const add = (k, v) => { if (v == null || v === '') return; dl.append(el('dt', null, k)); const dd = el('dd'); if (v instanceof Node) dd.append(v); else dd.textContent = v; dl.append(dd); };
  add('ID', entry.qualifiedId); add('種類', LABEL[entry.type] || entry.type); add('version', entry.version);
  add('author', typeof entry.author === 'object' ? entry.author.name : entry.author);
  add('checksum', entry.checksum);
  const prof = data.manifest && data.manifest.profile;
  if (prof) {
    add('profile', `${prof.repository}/${prof.path}`); add('commit', prof.commit); add('tree checksum', prof.checksum);
    add('files', prof.files.map((f) => f.path).join(', '));
  }
  if (data.resolve) add('upstream', `${data.resolve.repository} @ ${data.resolve.commit.slice(0, 7)}`);
  const link = el('a', null, 'フォルダを開く'); link.href = entry.folder; link.target = '_blank'; link.rel = 'noopener';
  add('source', link);
  d.append(dl);
  const install = entry.install || {};
  Object.entries(install).forEach(([k, v]) => { d.append(el('p', 'muted', k === 'itonami' ? 'Cloud Itonami で使う' : 'Hermes で使う'), el('pre', null, v)); });
  if (data.itonami && data.itonami.authority) d.append(el('p', 'muted', `権限: ${data.itonami.authority.default}（registry は何も付与しない）`));
}

$('#q').addEventListener('input', (ev) => { state.q = ev.target.value.trim(); render(); });
fetch('api/v1/index.json').then((r) => r.json()).then((index) => {
  state.entries = index.entries;
  $('#foot').textContent = index.registries.map((r) => `${r.id} ${r.commit === 'main' ? '' : '@ ' + r.commit.slice(0, 7)} (${r.count})`).join(' · ') + ` — API: api/v1/index.json`;
  render();
}).catch(() => { $('#list').replaceChildren(el('p', null, 'カタログを読み込めませんでした。')); });
</script>
</body>
</html>
